<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rentivo</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body data-page="login">

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <a href="index.html" class="auth-card__logo" id="headerLogo"></a>
        <h1 class="auth-card__title">Welcome Back</h1>
        <p class="auth-card__subtitle">Log in to your Rentivo account to continue.</p>
      </div>

      <!-- Social Logins -->
      <div class="social-logins">
        <button type="button" class="btn-social btn-social--google" onclick="RentivoApp.socialLogin('Google')">
          <span id="googleIcon"></span> Google
        </button>
        <button type="button" class="btn-social btn-social--apple" onclick="RentivoApp.socialLogin('Apple')">
          <span id="appleIcon"></span> Apple
        </button>
      </div>

      <div class="auth-divider">
        <span>or continue with email</span>
      </div>
      
      <form class="auth-card__form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="name@example.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Toggle password visibility">
              <span id="pwdEyeIcon"></span>
            </button>
          </div>
        </div>

        <div class="auth-card__actions">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link sent to your email!', 'info'); return false;" class="auth-card__link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary btn--full" style="font-weight:700;">Log In</button>
      </form>
      
      <div class="auth-card__footer">
        <p>Don't have an account? <a href="signup.html" class="auth-card__link">Sign up</a></p>
      </div>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top" title="Back to top">
    <svg class="back-to-top__progress" width="48" height="48" viewBox="0 0 48 48">
      <circle class="back-to-top__progress-bg" cx="24" cy="24" r="20" fill="none" stroke-width="3"/>
      <circle class="back-to-top__progress-bar" cx="24" cy="24" r="20" fill="none" stroke-width="3"/>
    </svg>
    <span class="back-to-top__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </span>
  </button>

  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('headerLogo').innerHTML = getRentivoLogo();
    if(document.getElementById('googleIcon')) document.getElementById('googleIcon').innerHTML = ICONS.google;
    if(document.getElementById('appleIcon')) document.getElementById('appleIcon').innerHTML = ICONS.apple;
    if(document.getElementById('pwdEyeIcon')) document.getElementById('pwdEyeIcon').innerHTML = ICONS.eye;
  </script>
</body>
</html>
