<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Rentivo</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body data-page="signup">

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <a href="index.html" class="auth-card__logo" id="headerLogo"></a>
        <h1 class="auth-card__title">Create an Account</h1>
        <p class="auth-card__subtitle">Join Rentivo to start renting premium products.</p>
      </div>

      <!-- Social Logins -->
      <div class="social-logins">
        <button type="button" class="btn-social btn-social--google" onclick="RentivoApp.socialLogin('Google')">
          <span id="googleIcon"></span> Google
        </button>
        <button type="button" class="btn-social btn-social--apple" onclick="RentivoApp.socialLogin('Apple')">
          <span id="appleIcon"></span> Apple
        </button>
      </div>

      <div class="auth-divider">
        <span>or sign up with email</span>
      </div>
      
      <form class="auth-card__form" id="signupForm">
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input type="text" class="form-input" id="signupName" placeholder="Alex Morgan" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input type="email" class="form-input" id="signupEmail" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="password-input-wrap">
            <input type="password" class="form-input" id="signupPassword" placeholder="Create a password (min. 8 chars)" required minlength="8">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('signupPassword', this)" title="Toggle password visibility">
              <span id="pwdEyeIcon"></span>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
          <div class="password-input-wrap">
            <input type="password" class="form-input" id="signupConfirmPassword" placeholder="Re-enter your password" required minlength="8">
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('signupConfirmPassword', this)" title="Toggle password visibility">
              <span id="pwdConfirmEyeIcon"></span>
            </button>
          </div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="form-group">
          <label class="checkbox-label" style="align-items: flex-start;">
            <input type="checkbox" id="signupTerms" required style="margin-top: 3px;">
            <span>I agree to the <a href="help.html" class="auth-card__link auth-card__link--accent">Terms of Service</a> &amp; <a href="help.html" class="auth-card__link auth-card__link--accent">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn--primary btn--full" style="font-weight:700;">Create Account</button>
      </form>
      
      <div class="auth-card__footer">
        <p>Already have an account? <a href="login.html" class="auth-card__link">Log in</a></p>
      </div>
    </div>
  </div>

  <!-- Back to Top Button -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top" title="Back to top">
    <svg class="back-to-top__progress" width="48" height="48" viewBox="0 0 48 48">
      <circle class="back-to-top__progress-bg" cx="24" cy="24" r="20" fill="none" stroke-width="3"/>
      <circle class="back-to-top__progress-bar" cx="24" cy="24" r="20" fill="none" stroke-width="3"/>
    </svg>
    <span class="back-to-top__icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </span>
  </button>

  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('headerLogo').innerHTML = getRentivoLogo();
    if(document.getElementById('googleIcon')) document.getElementById('googleIcon').innerHTML = ICONS.google;
    if(document.getElementById('appleIcon')) document.getElementById('appleIcon').innerHTML = ICONS.apple;
    if(document.getElementById('pwdEyeIcon')) document.getElementById('pwdEyeIcon').innerHTML = ICONS.eye;
    if(document.getElementById('pwdConfirmEyeIcon')) document.getElementById('pwdConfirmEyeIcon').innerHTML = ICONS.eye;
  </script>
</body>
</html>
